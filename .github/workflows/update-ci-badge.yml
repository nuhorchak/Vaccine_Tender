name: Update CI Badge

on:
  workflow_run:
    workflows: ["Julia Static Analysis"]
    types:
      - completed

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch CI Badge
        run: |
          curl -o ci-badge.svg -H "Authorization: token ${{ secrets.GH_PAT }}" \
          https://github.com/USERNAME/REPO_NAME/actions/workflows/julia-static-analysis.yml/badge.svg

      - name: Commit and Push Badge
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add ci-badge.svg
          git commit -m "Update CI badge" || echo "No changes to commit"
          git push origin main || echo "No changes to push"
